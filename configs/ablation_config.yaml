# 消融实验配置文件
# RGTransformer Ablation Study Configuration
# 
# V3.2 同步版本 - 与 src/trainer/config.py 保持一致
# 针对小样本（~530样本）优化：简化模型 + 加强正则化

experiment:
  name: "RGTransformer_Ablation_Study"
  runs_per_variant: 3
  seed: 42
  output_dir: "out/ablation"

# 训练参数（所有变体共享）
# 小数据策略：较小batch_size + 更长训练 + 严格早停
training:
  epochs: 1000                    # 小数据需要更多轮次
  batch_size: 16                  # 适中批量（更好的泛化）
  learning_rate: 0.0005           # 学习率（5e-4，更稳定）
  num_workers: 8                  # 数据加载进程数
  early_stopping_patience: 30     # 30轮无改善则停止
  precision: "16-mixed"           # 混合精度训练
  matmul_precision: "high"        # Tensor Cores 优化
  gradient_clip_val: 1.0          # 梯度裁剪
  warmup_epochs: 20               # 预热轮数
  min_lr: 0.000001                # 最小学习率（1e-6）
  weight_decay: 0.05              # 权重衰减（重要！防过拟合）

# 模型基础参数（V3.2 小样本优化版）
model:
  d_model: 512                    # 模型维度（适中）
  num_heads: 8                    # 注意力头数
  dim_feedforward: 1024           # FFN 维度 = d_model * 2
  num_attn_layers: 1              # 注意力层数（不宜过深）
  patch_size: 4
  dropout: 0.1                    # Dropout（防止过拟合）
  
  # 非线性增强
  ffn_activation: "swiglu"        # FFN 激活函数
  use_se_attention: true          # SE 通道注意力
  
  # 损失函数
  loss_type: "huber"              # Huber 损失（对异常值鲁棒）
  huber_delta: 1.0
  
  # 学习率调度
  use_lr_scheduler: true          # 余弦退火

# 数据集参数
dataset:
  seq_len: 2
  resolution: 1
  lat_range: [-80, 80]
  lon_range: [-180, 180]

# 消融变体定义
variants:
  baseline:
    display_name: "Baseline"
    description: "完整 RGTransformer 模型"
    
  wo_convstem:
    display_name: "w/o ConvStem"
    description: "使用 PatchEmbedding 替代 ConvStem"
    use_conv_stem: false
    
  wo_attention:
    display_name: "w/o EfficientRGA"
    description: "使用标准 MultiheadAttention 替代"
    use_efficient_attention: false
    
  wo_shpe:
    display_name: "w/o SHPE"
    description: "移除球谐波位置编码"
    use_spherical_encoding: false
    
  wo_multiscale:
    display_name: "w/o MultiScale"
    description: "使用单层反卷积替代多尺度解码器"
    use_multiscale_decoder: false
    
  wo_gate:
    display_name: "w/o Gate"
    description: "移除门控残差连接"
    use_gated_residual: false

# 可视化设置
visualization:
  style: "agu"  # agu, ieee, nature
  save_formats: ["pdf", "png"]
  dpi: 1200
  
  # 颜色方案（色盲友好）
  colors:
    - "#0072B2"  # Blue
    - "#D55E00"  # Vermillion
    - "#009E73"  # Green
    - "#CC79A7"  # Pink
    - "#F0E442"  # Yellow
    - "#56B4E9"  # Sky Blue

# 超参数敏感性分析
sensitivity:
  d_model: [128, 256, 512]
  num_heads: [4, 8, 16]
  num_attn_layers: [1, 2, 4]
  patch_size: [2, 4, 8]

