<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argo网格资料集构建流程图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Times New Roman", "SimSun", serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .flowchart-container {
            background: #ffffff;
            padding: 30px;
            max-width: 900px;
        }
        
        .figure-title {
            text-align: center;
            font-size: 12pt;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000000;
            font-family: "SimHei", "Arial", sans-serif;
        }
        
        .figure-caption {
            text-align: center;
            font-size: 10pt;
            color: #333333;
            margin-top: 15px;
            font-style: italic;
        }
        
        svg {
            display: block;
            margin: 0 auto;
        }
        
        /* 流程框样式定义 */
        .process-box {
            fill: #ffffff;
            stroke: #1a1a1a;
            stroke-width: 1.5;
        }
        
        .process-box-primary {
            fill: #e8f4fc;
            stroke: #2c5aa0;
            stroke-width: 1.5;
        }
        
        .process-box-secondary {
            fill: #f5f5f5;
            stroke: #4a4a4a;
            stroke-width: 1.2;
        }
        
        .process-box-output {
            fill: #e8f5e9;
            stroke: #2e7d32;
            stroke-width: 1.5;
        }
        
        .data-box {
            fill: #fff8e1;
            stroke: #f57c00;
            stroke-width: 1.2;
        }
        
        .decision-box {
            fill: #fce4ec;
            stroke: #c2185b;
            stroke-width: 1.2;
        }
        
        /* 文字样式 */
        .box-text {
            font-family: "SimSun", "Times New Roman", serif;
            font-size: 14px;
            fill: #1a1a1a;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .box-text-bold {
            font-family: "SimHei", "Arial", sans-serif;
            font-size: 14px;
            font-weight: bold;
            fill: #1a1a1a;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .box-text-small {
            font-family: "SimSun", "Times New Roman", serif;
            font-size: 11px;
            fill: #4a4a4a;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .annotation-text {
            font-family: "Times New Roman", serif;
            font-size: 11px;
            fill: #666666;
            font-style: italic;
        }
        
        /* 箭头和连线 */
        .arrow-line {
            stroke: #1a1a1a;
            stroke-width: 1.2;
            fill: none;
        }
        
        .arrow-head {
            fill: #1a1a1a;
        }
        
        .dashed-line {
            stroke: #666666;
            stroke-width: 1;
            stroke-dasharray: 4,3;
            fill: none;
        }
        
        /* 分组框 */
        .group-box {
            fill: none;
            stroke: #999999;
            stroke-width: 1;
            stroke-dasharray: 6,3;
        }
        
        .group-label {
            font-family: "SimHei", "Arial", sans-serif;
            font-size: 15px;
            font-weight: bold;
            fill: #333333;
        }
        
        #exportBtn {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-family: "SimHei", "Arial", sans-serif;
            background-color: #2c5aa0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #exportBtn:hover {
            background-color: #1e4080;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="flowchart-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="exportBtn" onclick="exportToPNG()">导出为PNG图片</button>
        </div>
        <div id="svg-wrapper" style="display: inline-block; background: #ffffff;">
        <svg id="flowchart-svg" width="720" height="940" viewBox="40 10 720 940">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" class="arrow-head"/>
                </marker>
                <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
                </marker>
            </defs>
            
            <!-- ============ 第一阶段：数据获取 ============ -->
            <g id="stage1">
                <!-- 分组框 -->
                <rect x="50" y="20" width="700" height="100" rx="5" class="group-box"/>
                <text x="70" y="38" class="group-label">数据获取阶段</text>
                
                <!-- 原始数据源 -->
                <rect x="100" y="55" width="140" height="50" rx="3" class="data-box"/>
                <text x="170" y="72" class="box-text-bold">Argo浮标剖面数据</text>
                <text x="170" y="88" class="box-text-small">(实时数据 + 延迟模式数据)</text>
                
                <!-- 辅助数据 -->
                <rect x="330" y="55" width="140" height="50" rx="3" class="data-box"/>
                <text x="400" y="72" class="box-text-bold">辅助资料</text>
                <text x="400" y="88" class="box-text-small">(WOA气候态、地形数据)</text>
                
                <!-- 历史数据 -->
                <rect x="560" y="55" width="140" height="50" rx="3" class="data-box"/>
                <text x="630" y="72" class="box-text-bold">历史船测/CTD数据</text>
                <text x="630" y="88" class="box-text-small">(补充验证)</text>
            </g>
            
            <!-- 连接线：数据获取到质量控制 -->
            <line x1="170" y1="105" x2="170" y2="140" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="400" y1="105" x2="400" y2="140" class="arrow-line" marker-end="url(#arrowhead)"/>
            <path d="M 630 105 L 630 125 L 400 125 L 400 140" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- ============ 第二阶段：质量控制 ============ -->
            <g id="stage2">
                <rect x="50" y="140" width="700" height="130" rx="5" class="group-box"/>
                <text x="70" y="158" class="group-label">质量控制阶段</text>
                
                <!-- 实时QC -->
                <rect x="100" y="170" width="130" height="45" rx="3" class="process-box-primary"/>
                <text x="165" y="187" class="box-text-bold">实时质量控制</text>
                <text x="165" y="202" class="box-text-small">(RT-QC)</text>
                
                <!-- 延迟模式QC -->
                <rect x="270" y="170" width="130" height="45" rx="3" class="process-box-primary"/>
                <text x="335" y="187" class="box-text-bold">延迟模式质量控制</text>
                <text x="335" y="202" class="box-text-small">(DM-QC)</text>
                
                <!-- QC检验项目说明 -->
                <rect x="440" y="165" width="260" height="55" rx="3" class="process-box-secondary"/>
                <text x="570" y="180" class="box-text-small">检验项目：</text>
                <text x="570" y="193" class="box-text-small">• 平台位置检验 • 不可能日期检验</text>
                <text x="570" y="206" class="box-text-small">• 压力递增检验 • 尖峰检验 • 密度逆转检验</text>
                
                <!-- 质量标记 -->
                <rect x="185" y="225" width="130" height="35" rx="3" class="process-box"/>
                <text x="250" y="238" class="box-text">质量标记赋值</text>
                <text x="250" y="253" class="box-text-small">(QC Flag)</text>
            </g>
            
            <!-- 连接线：QC流程内部 -->
            <line x1="165" y1="215" x2="165" y2="232" class="arrow-line"/>
            <path d="M 165 232 L 185 242" class="arrow-line"/>
            <line x1="335" y1="215" x2="335" y2="232" class="arrow-line"/>
            <path d="M 335 232 L 315 242" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="440" y1="192" x2="410" y2="192" class="dashed-line" marker-end="url(#arrowhead-gray)"/>
            
            <!-- 连接线：质量控制到数据预处理 -->
            <line x1="250" y1="260" x2="250" y2="290" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- ============ 第三阶段：数据预处理 ============ -->
            <g id="stage3">
                <rect x="50" y="290" width="700" height="120" rx="5" class="group-box"/>
                <text x="70" y="308" class="group-label">数据预处理阶段</text>
                
                <!-- 剔除异常值 -->
                <rect x="100" y="325" width="120" height="45" rx="3" class="process-box-primary"/>
                <text x="160" y="342" class="box-text-bold">异常值剔除</text>
                <text x="160" y="357" class="box-text-small">(基于QC标记)</text>
                
                <!-- 标准层插值 -->
                <rect x="260" y="325" width="120" height="45" rx="3" class="process-box-primary"/>
                <text x="320" y="342" class="box-text-bold">标准层插值</text>
                <text x="320" y="357" class="box-text-small">(垂向58层)</text>
                
                <!-- 气候态异常计算 -->
                <rect x="420" y="325" width="140" height="45" rx="3" class="process-box-primary"/>
                <text x="490" y="342" class="box-text-bold">气候态异常计算</text>
                <text x="490" y="357" class="box-text-small">(T′ = T − T<tspan baseline-shift="sub" font-size="8px">clim</tspan>)</text>
                
                <!-- 空间分布均匀化 -->
                <rect x="600" y="325" width="120" height="45" rx="3" class="process-box-primary"/>
                <text x="660" y="342" class="box-text-bold">空间分布处理</text>
                <text x="660" y="357" class="box-text-small">(网格箱平均)</text>
            </g>
            
            <!-- 连接线：预处理流程 -->
            <path d="M 250 290 L 250 310 L 160 310 L 160 325" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="220" y1="347" x2="260" y2="347" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="380" y1="347" x2="420" y2="347" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="560" y1="347" x2="600" y2="347" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- 连接线：预处理到背景场 -->
            <line x1="660" y1="370" x2="660" y2="430" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- ============ 第四阶段：客观分析 ============ -->
            <g id="stage4">
                <rect x="50" y="430" width="700" height="170" rx="5" class="group-box"/>
                <text x="70" y="448" class="group-label">客观分析阶段</text>
                
                <!-- 背景场构建 -->
                <rect x="530" y="460" width="150" height="50" rx="3" class="process-box-primary"/>
                <text x="605" y="480" class="box-text-bold">背景场构建</text>
                <text x="605" y="495" class="box-text-small">(First-guess field)</text>
                
                <!-- 相关函数 -->
                <rect x="100" y="460" width="150" height="50" rx="3" class="process-box-secondary"/>
                <text x="175" y="480" class="box-text-bold">相关函数估计</text>
                <text x="175" y="495" class="box-text-small">C(r) = (1+r/L)e<tspan baseline-shift="super" font-size="8px">−r/L</tspan></text>
                
                <!-- 误差协方差 -->
                <rect x="290" y="460" width="150" height="50" rx="3" class="process-box-secondary"/>
                <text x="365" y="480" class="box-text-bold">误差协方差矩阵</text>
                <text x="365" y="495" class="box-text-small">(观测误差 + 背景误差)</text>
                
                <!-- 最优插值/客观分析 -->
                <rect x="250" y="535" width="300" height="55" rx="3" class="process-box-primary" style="stroke-width: 2"/>
                <text x="400" y="553" class="box-text-bold" style="font-size: 15px">最优插值 / 客观分析 (OI/OA)</text>
                <text x="400" y="570" class="box-text-small">x<tspan baseline-shift="sub" font-size="8px">a</tspan> = x<tspan baseline-shift="sub" font-size="8px">b</tspan> + K(y − Hx<tspan baseline-shift="sub" font-size="8px">b</tspan>)</text>
                <text x="400" y="583" class="box-text-small">K = BH<tspan baseline-shift="super" font-size="8px">T</tspan>(HBH<tspan baseline-shift="super" font-size="8px">T</tspan> + R)<tspan baseline-shift="super" font-size="8px">−1</tspan></text>
            </g>
            
            <!-- 连接线：客观分析内部 -->
            <line x1="175" y1="510" x2="175" y2="540" class="arrow-line"/>
            <path d="M 175 540 L 175 562 L 250 562" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="365" y1="510" x2="365" y2="535" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="605" y1="510" x2="605" y2="540" class="arrow-line"/>
            <path d="M 605 540 L 605 562 L 550 562" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- 连接线：客观分析到后处理 -->
            <line x1="400" y1="590" x2="400" y2="620" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- ============ 第五阶段：后处理 ============ -->
            <g id="stage5">
                <rect x="50" y="620" width="700" height="100" rx="5" class="group-box"/>
                <text x="70" y="638" class="group-label">后处理阶段</text>
                
                <!-- 时间序列合成 -->
                <rect x="130" y="655" width="130" height="45" rx="3" class="process-box-primary"/>
                <text x="195" y="672" class="box-text-bold">时间序列合成</text>
                <text x="195" y="687" class="box-text-small">(月平均)</text>
                
                <!-- 异常值检测 -->
                <rect x="305" y="655" width="130" height="45" rx="3" class="process-box-primary"/>
                <text x="370" y="672" class="box-text-bold">后验异常检测</text>
                <text x="370" y="687" class="box-text-small">(空间一致性检验)</text>
                
                <!-- 物理约束 -->
                <rect x="480" y="655" width="130" height="45" rx="3" class="process-box-primary"/>
                <text x="545" y="672" class="box-text-bold">物理约束校正</text>
                <text x="545" y="687" class="box-text-small">(密度稳定性)</text>
            </g>
            
            <!-- 连接线：后处理流程 -->
            <path d="M 400 620 L 195 620 L 195 655" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="260" y1="677" x2="305" y2="677" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="435" y1="677" x2="480" y2="677" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- 连接线：后处理到产品输出 -->
            <line x1="545" y1="700" x2="545" y2="740" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- ============ 第六阶段：产品输出 ============ -->
            <g id="stage6">
                <rect x="50" y="740" width="700" height="160" rx="5" class="group-box"/>
                <text x="70" y="758" class="group-label">产品输出与验证</text>
                
                <!-- 网格产品 -->
                <rect x="420" y="770" width="200" height="55" rx="3" class="process-box-output"/>
                <text x="520" y="788" class="box-text-bold" style="fill: #1b5e20">Argo网格资料集产品</text>
                <text x="520" y="803" class="box-text-small">(NetCDF格式)</text>
                <text x="520" y="816" class="box-text-small">1°×1°空间分辨率 | 月平均</text>
                
                <!-- 输出变量 -->
                <rect x="100" y="770" width="160" height="55" rx="3" class="process-box-secondary"/>
                <text x="180" y="788" class="box-text-bold">输出变量</text>
                <text x="180" y="803" class="box-text-small">• 温度场 (T) • 盐度场 (S)</text>
                <text x="180" y="816" class="box-text-small">• 分析误差场 • 观测数量场</text>
                
                <!-- 验证 -->
                <rect x="330" y="845" width="140" height="45" rx="3" class="decision-box"/>
                <text x="400" y="862" class="box-text-bold">交叉验证</text>
                <text x="400" y="877" class="box-text-small">(独立资料比对)</text>
                
                <!-- 发布 -->
                <rect x="520" y="845" width="130" height="45" rx="3" class="process-box-output"/>
                <text x="585" y="862" class="box-text-bold" style="fill: #1b5e20">产品发布</text>
                <text x="585" y="877" class="box-text-small">(数据中心存档)</text>
            </g>
            
            <!-- 连接线：产品输出 -->
            <path d="M 545 740 L 520 740 L 520 770" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="260" y1="797" x2="420" y2="797" class="dashed-line" marker-end="url(#arrowhead-gray)"/>
            <line x1="520" y1="825" x2="520" y2="835" class="arrow-line"/>
            <path d="M 520 835 L 400 835 L 400 845" class="arrow-line" marker-end="url(#arrowhead)"/>
            <line x1="470" y1="867" x2="520" y2="867" class="arrow-line" marker-end="url(#arrowhead)"/>
            
            <!-- 反馈箭头 -->
            <path d="M 330 867 L 70 867 L 70 347 L 100 347" class="dashed-line" marker-end="url(#arrowhead-gray)"/>
            <!-- 文字背景 -->
            <rect x="67" y="555" width="16" height="50" fill="#ffffff" transform="rotate(0)"/>
            <text x="75" y="600" class="annotation-text" transform="rotate(-90, 75, 600)">质量反馈</text>
            
            <!-- 图例 -->
            <g id="legend" transform="translate(100, 915)">
                <rect x="0" y="5" width="20" height="14" rx="2" class="data-box"/>
                <text x="25" y="15" class="box-text-small" style="text-anchor: start">输入数据</text>
                <rect x="110" y="5" width="20" height="14" rx="2" class="process-box-primary"/>
                <text x="135" y="15" class="box-text-small" style="text-anchor: start">处理步骤</text>
                <rect x="220" y="5" width="20" height="14" rx="2" class="process-box-output"/>
                <text x="245" y="15" class="box-text-small" style="text-anchor: start">输出产品</text>
                <rect x="330" y="5" width="20" height="14" rx="2" class="decision-box"/>
                <text x="355" y="15" class="box-text-small" style="text-anchor: start">验证环节</text>
                <line x1="440" y1="12" x2="460" y2="12" class="dashed-line"/>
                <text x="465" y="15" class="box-text-small" style="text-anchor: start">辅助/反馈</text>
            </g>
        </svg>
        </div>
    </div>
    
    <script>
        function exportToPNG() {
            const wrapper = document.getElementById('svg-wrapper');
            
            html2canvas(wrapper, {
                scale: 4,
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: true,
                allowTaint: true
            }).then(function(canvas) {
                // 下载图片
                const link = document.createElement('a');
                link.download = 'Argo网格资料集构建流程图.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(function(error) {
                console.error('导出失败:', error);
                alert('导出失败，请重试');
            });
        }
    </script>
</body>
</html>
