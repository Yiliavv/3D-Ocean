[project]
name = "3d-ocean"
version = "0.1.0"
description = "3D Ocean Temperature Field Prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow>=1.4.0",
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "cmocean>=4.0.3",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "lightning>=2.5.5",
    "matplotlib>=3.10.7",
    "netcdf4>=1.7.3",
    "notebook>=7.4.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "tabulate>=0.9.0",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "wandb>=0.22.2",
    "einops>=0.8.0",
    "pytest>=9.0.2",
]

# 配置 PyTorch CUDA 12.8 源
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
